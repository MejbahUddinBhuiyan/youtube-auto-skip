<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Auto Skip</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>YouTube Auto Skip</h1>

    <label>
      <input id="enabled" type="checkbox" role="switch" disabled>
      Enable automatic skipping
    </label>

    <p id="status" role="status" aria-live="polite">
      Loading setting…
    </p>

    <p class="note">
      Your preference is saved on this computer.
    </p>
  </main>
</body>
</html>
